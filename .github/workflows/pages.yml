# Publishes the app/ folder (the astronaut dashboard) to GitHub Pages.
# It runs by itself every time something is merged into main, and you can
# also start it by hand from the repo's "Actions" tab ("Run workflow").
# The site appears at https://abdulla-albassam.github.io/space-apps-hackathon-tylanauts/
name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces an older one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers keep a copy of each file for about 10 minutes. Adding "?v=<this commit>" to the
      # links to our own .css and .js files makes every publish look like new files, so a normal
      # page refresh always shows the latest version. Only the published copy is changed.
      - name: Stamp the file links with this version
        run: sed -i -E 's/(href|src)="([A-Za-z0-9_-]+\.(css|js))"/\1="\2?v='"${GITHUB_SHA::8}"'"/g' app/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
