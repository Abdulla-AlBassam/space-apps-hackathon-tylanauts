<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sirius · Crew overview</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<!-- sirius.css is the shared brand (colours, fonts, logo, dial). crew.css has the rest this page
     needs, so it keeps working while styles.css changes. -->
<link rel="stylesheet" href="sirius.css">
<link rel="stylesheet" href="crew.css">
</head>
<body>

<!--
  Crew overview, kept deliberately simple. It answers three questions:
    1. Where do several crew members line up (the same thing dropping at the same time)?
    2. What is the issue?
    3. What is a suggested fix?
  Under that, one small table shows everyone today. Everything is drawn by crew.js.
  All data is simulated.
-->
<main class="cw">
  <header class="cw-top">
    <a class="cw-back" href="index.html" aria-label="Back to Sirius">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="cw-logo"></span><span class="wordmark">Sirius</span>
    </a>
    <div class="cw-who">
      <h1>Crew overview <span class="sample-tag" title="Made-up numbers for the demo. Real readings will replace them once the crew page reads from the backend.">Sample data</span></h1>
      <p id="cw-mission">Mission</p>
    </div>
    <div class="cw-top-right">
      <div class="switch" role="group" aria-label="Who is viewing">
        <button type="button" id="view-astro" aria-pressed="false">Astronaut</button>
        <button type="button" id="view-surgeon" aria-pressed="true">Flight surgeon</button>
      </div>
      <button type="button" class="help" data-help="view" aria-label="What is this?">?</button>
    </div>
  </header>

  <!-- One line: the crew score and how many shared patterns there are -->
  <section class="cw-score" id="cw-score" aria-label="Crew score"></section>

  <!-- The main part: one short row per shared pattern (who, the issue, a suggested fix) -->
  <section aria-label="Shared patterns">
    <div class="sec-head">
      <h2>Where the crew lines up</h2>
      <button type="button" class="help" data-help="patterns" aria-label="What is this?">?</button>
    </div>
    <div class="insights" id="insights"></div>
  </section>

  <!-- Everyone today, so one person struggling is never hidden by an average -->
  <section aria-label="Everyone today">
    <div class="sec-head">
      <h2>Everyone today</h2>
      <button type="button" class="help" data-help="grid" aria-label="What is this?">?</button>
      <span class="spacer"></span>
      <div class="cw-legend" aria-label="Colour key">
        <span class="is-good" id="lg-good"></span>
        <span class="is-watch" id="lg-watch"></span>
        <span class="is-act" id="lg-act"></span>
      </div>
    </div>
    <div class="cw-grid-wrap"><table class="cw-grid" id="grid"></table></div>
  </section>

  <p class="footer-note">Simulated crew and data for a demo. Sirius is built by Team Tylanauts for NASA Space Apps 2026.</p>
</main>

<div class="help-pop" id="help-pop" role="tooltip"></div>

<script src="sirius.js"></script>
<script src="crew.js"></script>
</body>
</html>
